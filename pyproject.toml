[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tashi-fpl-mcp"
version = "1.0.0"
description = "Read-only Fantasy Premier League and mini-league analysis MCP server for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic-settings>=2.4,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
fpl-mcp = "fpl_mcp.server:main"
fpl-mcp-set-token = "fpl_mcp.token_store:set_token_main"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

