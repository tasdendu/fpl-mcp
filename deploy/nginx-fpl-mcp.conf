# Place the limit_req_zone directive in nginx.conf's http {} block when it is
# not already defined there.
limit_req_zone $binary_remote_addr zone=fpl_mcp:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name fpl-ai.example.com;

    # Replace with the certificate paths managed by Certbot or your proxy.
    ssl_certificate /etc/letsencrypt/live/fpl-ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fpl-ai.example.com/privkey.pem;

    location = /mcp {
        limit_req zone=fpl_mcp burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

